name: Build debug APK

on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: JDK version
        type: string
        default: '17'
      engine_repo:
        description: Engine repo (owner/name)
        type: string
        default: 'ALEX5402/NewBlackbox'
      engine_ref:
        description: Engine branch or tag (blank = default branch)
        type: string
        default: ''
      engine_module:
        description: Engine core library module (folder and Gradle name)
        type: string
        default: 'Bcore'
      abi:
        description: Which edition(s) to build
        type: choice
        options: [both, arm64-v8a, armeabi-v7a]
        default: both
      extra_sdk_packages:
        description: 'Optional extra sdkmanager packages, space separated (e.g. ndk;29.0.13846066)'
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.abi == 'both' && '["arm64-v8a","armeabi-v7a"]' || format('["{0}"]', inputs.abi)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk_version }}

      # Accepts SDK licenses so Gradle can auto-download whatever platform/NDK/CMake the engine asks for.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ${{ inputs.extra_sdk_packages }}

      - name: Fetch engine
        env:
          REPO: ${{ inputs.engine_repo }}
          REF: ${{ inputs.engine_ref }}
          MODULE: ${{ inputs.engine_module }}
        run: |
          set -e
          ARGS=""
          if [ -n "$REF" ]; then ARGS="--branch $REF"; fi
          git clone --depth 1 --recurse-submodules $ARGS "https://github.com/$REPO" engine
          echo "Engine commit: $(git -C engine rev-parse HEAD)"
          echo "--- engine top level ---"; ls engine
          if [ ! -d "engine/$MODULE" ]; then
            echo "::error::Folder '$MODULE' not found in $REPO. Set the engine_module input to the engine's core module folder (see listing above)."
            exit 1
          fi
          if [ ! -f engine/gradlew ]; then
            echo "::error::Engine has no gradlew wrapper; pick a different engine_repo/engine_ref."
            exit 1
          fi
          ls engine/LICENSE* 2>/dev/null || echo "::warning::No LICENSE file in engine repo - check its license."

      - name: Inject CloneSpace module into the engine build
        env:
          MODULE: ${{ inputs.engine_module }}
        run: |
          set -e
          SETTINGS=""
          for f in engine/settings.gradle engine/settings.gradle.kts; do [ -f "$f" ] && SETTINGS="$f"; done
          if [ -z "$SETTINGS" ]; then echo "::error::No settings.gradle(.kts) in engine"; exit 1; fi
          cp -r cloneapp engine/cloneapp
          sed -i "s#project(':Bcore')#project(':$MODULE')#" engine/cloneapp/build.gradle
          printf '\n' >> "$SETTINGS"
          if [[ "$SETTINGS" == *.kts ]]; then echo 'include(":cloneapp")' >> "$SETTINGS"; else echo "include ':cloneapp'" >> "$SETTINGS"; fi
          echo "--- $SETTINGS ---"; cat "$SETTINGS"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew :cloneapp:assembleDebug -PtargetAbi=${{ matrix.abi }} --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp engine/cloneapp/build/outputs/apk/debug/*.apk "out/CloneSpace-${{ matrix.abi }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CloneSpace-${{ matrix.abi }}-debug
          path: out/*.apk
